name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The native UI tests and the Chromium tests need macOS and Google Chrome,
    # which the macOS runner has.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .

      - name: Test
        run: go test ./...

      - name: Chromium integration tests
        env:
          SITE_SUCKER_BROWSER_TEST: "1"
        run: go test ./internal/crawler -run Browser -v

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
